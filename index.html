<style>
:root{
  --bg:#E3E9ED; --surface:#FFFFFF; --surface-2:#F1F5F7; --field:#FFFFFF; --field-border:#8499A8;
  --ink:#12324A; --text:#15232E; --muted:#44596A; --line:#C3CFD8; --brand:#1597CF; --brand-ink:#07547A;
  --on-brand:#FFFFFF; --tint:#E1F2FB; --danger:#B3261E; --danger-tint:#FCE9E7;
  --font:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C171F; --surface:#15232E; --surface-2:#1A2B37; --field:#0F1B24; --field-border:#5E7888;
    --ink:#E6F1F7; --text:#E1EAF0; --muted:#A9BCC9; --line:#2A4352; --brand:#39B7EA; --brand-ink:#9BDCF7;
    --on-brand:#04202F; --tint:#133647; --danger:#FF8A75; --danger-tint:#3A1D18; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C171F; --surface:#15232E; --surface-2:#1A2B37; --field:#0F1B24; --field-border:#5E7888;
  --ink:#E6F1F7; --text:#E1EAF0; --muted:#A9BCC9; --line:#2A4352; --brand:#39B7EA; --brand-ink:#9BDCF7;
  --on-brand:#04202F; --tint:#133647; --danger:#FF8A75; --danger-tint:#3A1D18; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
img{max-width:100%}

/* App bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);display:flex;align-items:center;gap:4px;padding:10px 8px 10px 16px}
.bar h1{font-size:21px;font-weight:700;margin:0;line-height:1.2;color:#fff}
.bar .no{font-size:15px;color:#A8DFF6;font-weight:500}
.bar .no.draft{color:#C4D2DC}
.bar .grow{flex:1;min-width:0}
.ibtn{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:500;padding:6px 6px;border-radius:12px;min-width:58px;min-height:56px;justify-content:center}
.ibtn svg{width:26px;height:26px}
.ibtn:active{background:rgba(255,255,255,.15)}
.ibtn.armed{background:var(--danger);font-size:13px;padding:6px 8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bar{background:#08121A}}
:root[data-theme="dark"] .bar{background:#08121A}

main{max-width:640px;margin:0 auto;padding:16px 12px 170px}

/* Steps */
.step{display:flex;align-items:center;gap:12px;margin:26px 4px 12px}
.step:first-child{margin-top:6px}
.step .n{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--surface);font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;flex:none}
.step h2{margin:0;font-size:22px;font-weight:700;color:var(--ink);line-height:1.25}
.card{background:var(--surface);border-radius:16px;padding:18px 16px 6px;margin-bottom:14px;border:1.5px solid var(--line)}
.card.flat{padding-bottom:16px}

/* Fields */
label.f{display:block;margin-bottom:18px}
.lb{display:block;font-size:17px;font-weight:600;color:var(--text);margin-bottom:6px}
.lb em{font-style:normal;font-weight:400;color:var(--muted);font-size:15px}
.inp{display:block;width:100%;background:var(--field);border:2px solid var(--field-border);border-radius:12px;padding:12px 14px;font-size:19px;line-height:1.35;min-height:56px;-webkit-appearance:none;appearance:none;color:var(--text)}
.inp::placeholder{color:transparent}
.inp:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 25%,transparent)}
.inp[readonly]{background:var(--surface-2);border-style:dashed;color:var(--muted)}
textarea.inp{min-height:92px;resize:vertical}
.inp.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
input[type="date"].inp{min-height:56px}
.hint{display:block;font-size:15px;color:var(--muted);margin-top:6px;line-height:1.45}
.note{font-size:16px;color:var(--muted);margin:-6px 0 16px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:560px){.row2{grid-template-columns:1fr 1fr;gap:14px}}

/* Group (one uniform set) */
.grp{background:var(--surface);border-radius:16px;margin-bottom:16px;border:2px solid var(--brand);overflow:hidden}
.grp-band{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--tint);padding:10px 12px 10px 16px;border-bottom:2px solid var(--brand)}
.grp-band b{font-size:20px;color:var(--brand-ink)}
.grp-in{padding:16px 16px 14px}
.photo-row{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.ph{width:84px;height:104px;border-radius:12px;border:2px dashed var(--field-border);background:var(--field) center/contain no-repeat;flex:none}
.ph.has{border-style:solid}
.photo-row .btns{display:flex;flex-direction:column;gap:8px;align-items:flex-start}

/* Item box */
.item{border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 14px 14px;margin-bottom:14px}
.item-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.item-head b{font-size:18px;color:var(--ink)}
.item label.f{margin-bottom:12px}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nums label.f{margin-bottom:12px}
.lt-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:2px dashed var(--line);padding-top:10px;margin-top:2px}
.lt-row span{font-size:16px;color:var(--muted)}
.lt-row b{font-size:21px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Buttons */
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:18px;min-height:56px;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2}
.btn.pri{background:var(--brand);color:var(--on-brand)}
.btn.sec{background:var(--surface);color:var(--ink);border:2px solid var(--ink)}
.btn.out{background:var(--surface);color:var(--brand-ink);border:2px solid var(--brand);width:100%}
.btn.big{width:100%;min-height:60px;font-size:19px}
.btn[disabled]{opacity:.6}
.btn svg{width:22px;height:22px;flex:none}
.sbtn{background:var(--surface);border:2px solid var(--field-border);border-radius:12px;min-height:48px;padding:8px 14px;font-size:16px;font-weight:600;color:var(--ink)}
.sbtn.danger{border-color:var(--danger);color:var(--danger);background:transparent}
.sbtn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.grp.plain{border:1.5px solid var(--line)}
.grp-band b small{display:block;font-size:15px;font-weight:500;color:var(--muted);line-height:1.3;margin-top:1px}
.meta{border-bottom:2px dashed var(--line);margin-bottom:16px;padding-bottom:4px}
.meta .photo-row{margin-bottom:10px}
.meta-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.meta-head b{font-size:18px;color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--muted);font-size:16px;font-weight:600;text-decoration:underline;padding:8px 0 10px;min-height:44px}
.seg{display:grid;grid-template-columns:.8fr 1.3fr .8fr;gap:8px}
.seg button{min-height:54px;border:2px solid var(--field-border);border-radius:12px;background:var(--field);font-size:16.5px;font-weight:600;color:var(--text);padding:6px 4px;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
div.f{margin-bottom:18px}
.bk{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bk .btn{width:100%;padding:10px 8px;font-size:17px}
.btn.ghost{width:100%;background:transparent;border:2px dashed var(--field-border);color:var(--ink);font-weight:600;margin-top:10px}
.add-grp{margin:4px 0 8px}

/* Switch */
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 0 16px;font-size:18px;font-weight:600}
.switch input{appearance:none;-webkit-appearance:none;width:60px;height:36px;border-radius:18px;background:var(--field-border);position:relative;flex:none;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked{background:var(--brand)}
.switch input:checked::after{transform:translateX(24px)}
.switch small{display:block;font-weight:400;font-size:15px;color:var(--muted)}

/* Totals */
.tot{display:grid;grid-template-columns:1fr auto;row-gap:10px;font-variant-numeric:tabular-nums;padding:4px 0 14px;font-size:19px}
.tot .k{color:var(--muted)}
.tot .v{text-align:right;font-weight:600}
.tot .gk{font-weight:700;color:var(--ink);border-top:2px solid var(--line);padding-top:10px}
.tot .grand{font-size:26px;font-weight:700;color:var(--ink);border-top:2px solid var(--line);padding-top:6px;text-align:right}

/* Bottom action bar */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.actions .in{width:100%;max-width:640px}
.sum{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px}
.sum small{font-size:16px;color:var(--muted)}
.sum b{font-size:23px;color:var(--ink);font-variant-numeric:tabular-nums}
.actions .btns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}

/* Sheets */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet[hidden]{display:none}
.sheet header{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;background:var(--surface);border-bottom:2px solid var(--line)}
.sheet header h2{flex:1;margin:0;font-size:21px;color:var(--ink)}
.sheet .body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 12px 28px}
.sheet .body > *{max-width:640px;margin-left:auto;margin-right:auto}
.sheet footer{padding:10px 12px;background:var(--surface);border-top:2px solid var(--line);display:flex;justify-content:center}
.sheet footer .btn{flex:1;max-width:420px}
.sheet footer.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet footer.two .btn{max-width:none;font-size:17px;padding:10px 8px}
.close{background:var(--surface-2);border:2px solid var(--line);min-height:52px;padding:0 14px;border-radius:14px;display:flex;align-items:center;gap:6px;color:var(--ink);font-size:17px;font-weight:600}
.close svg{width:22px;height:22px}

.pv{display:flex;flex-direction:column;align-items:center;gap:14px}
.pv-wrap{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2);overflow:hidden;position:relative}
.pv-wrap .pg{transform-origin:0 0;position:absolute;left:0;top:0}
.pv-note{font-size:16px;color:var(--muted);text-align:center}

.imgset{display:flex;gap:14px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.imgset .prev{width:150px;height:56px;background:#fff center/contain no-repeat;border:2px solid var(--line);border-radius:10px;flex:none}
.imgset .ctl{display:flex;flex-direction:column;gap:8px;align-items:flex-start}

.h-item{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.h-item .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.h-item .t b{color:var(--ink);font-size:20px}
.h-item .t span{font-variant-numeric:tabular-nums;font-weight:700;font-size:19px}
.h-item .s{color:var(--muted);font-size:17px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-item .a{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:18px}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:14px 20px;border-radius:14px;font-size:18px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast,.switch input,.switch input::after{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- helpers ---------- */
function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){const n=parseFloat(String(v==null?'':v).replace(/,/g,''));return isFinite(n)?n:0}
function r2(n){return Math.round((n+Number.EPSILON)*100)/100}
function money(n){return num(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function qtyFmt(v){const n=num(v);return n.toLocaleString('en-US',{maximumFractionDigits:2})}
function pad3(n){return String(n).padStart(3,'0')}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function beYY(d){d=d||new Date();return String((d.getFullYear()+543)%100).padStart(2,'0')}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function docDate(iso){if(!iso)return '';const [y,m,d]=iso.split('-').map(Number);return d+' '+MON[m-1]+' '+String(y%100).padStart(2,'0')}
function thDate(iso){if(!iso)return '';const [y,m,d]=iso.split('-').map(Number);return d+'/'+m+'/'+String((y+543)%100).padStart(2,'0')}
function mergeSettings(s){const o=Object.assign(clone(DEF_SETTINGS),s||{});o.company=Object.assign({},DEF_SETTINGS.company,(s&&s.company)||{});return o}
function signImg(){return SIGN||DEFAULT_SIGN}
function stampImg(){return STAMP||DEFAULT_STAMP}

const LS={
  get(k){try{const v=localStorage.getItem('kqt:'+k);return v?JSON.parse(v):null}catch(e){return null}},
  set(k,v){try{localStorage.setItem('kqt:'+k,JSON.stringify(v));return true}catch(e){return false}},
  del(k){try{localStorage.removeItem('kqt:'+k)}catch(e){}}
};

/* ---------- storage: shared db when available, device storage otherwise ---------- */
const store={
  async get(path){
    if(db){try{const s=await db.doc(path).get();return s.exists?clone(s.data()):null}catch(e){console.warn('db get',e)}}
    return LS.get(path);
  },
  async set(path,data){
    if(db){try{await db.doc(path).set(data);return 'db'}catch(e){console.warn('db set',e);if(e&&e.code==='invalid_argument')throw e}}
    return LS.set(path,data)?'ls':false;
  },
  async del(path){
    if(db){try{await db.doc(path).delete()}catch(e){console.warn('db del',e)}}
    LS.del(path);
    const idx=(LS.get('quotes-index')||[]).filter(id=>'quotes/'+id!==path);LS.set('quotes-index',idx);
  },
  async saveQuote(q){
    const r=await this.set('quotes/'+q.id,q);
    if(r==='ls'){const idx=LS.get('quotes-index')||[];if(!idx.includes(q.id)){idx.push(q.id);LS.set('quotes-index',idx)}}
    return r;
  },
  async listQuotes(all){
    let out=[];
    if(db){try{const s=await db.collection('quotes').orderBy('updatedAt','desc').limit(all?1000:50).get();out=s.docs.map(d=>d.data())}catch(e){console.warn('db list',e)}}
    const local=(LS.get('quotes-index')||[]).map(id=>LS.get('quotes/'+id)).filter(Boolean);
    const seen=new Set(out.map(q=>q.id));
    local.forEach(q=>{if(!seen.has(q.id))out.push(q)});
    return out.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  }
};

/* ---------- quote model ---------- */
function newItem(){return {id:uid(),desc:'',price:'',qty:''}}
function newGroup(){return {id:uid(),title:'',forLine:'',photo:null,items:[newItem()]}}
function newQuote(){return {id:uid(),no:null,date:todayISO(),customer:{attn:'',address:'',taxId:'',branchType:'',branchNo:'',tel:''},groups:[newGroup()],vat:!!S.vatDefault,notes:'',createdAt:Date.now(),updatedAt:Date.now()}}
function totals(q){
  let sub=0;q.groups.forEach(g=>g.items.forEach(it=>{sub+=num(it.price)*num(it.qty)}));
  sub=r2(sub);const vat=q.vat?r2(sub*0.07):0;return {sub,vat,grand:r2(sub+vat)};
}
function hasContent(q){return q.groups.some(g=>g.title||g.items.some(i=>i.desc||num(i.price)))||!!q.customer.attn}
function previewNo(){
  const yy=beYY();const n=(S.counterYear&&S.counterYear!==yy)?1:S.nextNo;
  return yy+'-'+(S.prefix||'')+'-'+pad3(n);
}
async function allocateNo(){
  const fresh=await store.get('settings/main');
  if(fresh)S=mergeSettings(fresh);
  const yy=beYY();
  if(S.counterYear!==yy){if(S.counterYear)S.nextNo=1;S.counterYear=yy}
  const no=yy+'-'+(S.prefix||'')+'-'+pad3(S.nextNo);
  S.nextNo=num(S.nextNo)+1;
  await store.set('settings/main',S);LS.set('settings-cache',S);
  return no;
}

function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{res(i)};i.onerror=rej;i.src=u})}
function photoData(img){
  const maxH=360,maxW=280;const s=Math.min(1,maxH/img.naturalHeight,maxW/img.naturalWidth);
  const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.82);
}
/* turn a photo of ink on paper into a transparent-background image, trimmed */
function inkData(img){
  const maxW=700;const s=Math.min(1,maxW/img.naturalWidth);
  const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
  const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  let minX=c.width,minY=c.height,maxX=-1,maxY=-1;
  for(let y=0;y<c.height;y++)for(let xx=0;xx<c.width;xx++){
    const k=(y*c.width+xx)*4;const l=(p[k]+p[k+1]+p[k+2])/3;
    let a=Math.max(0,Math.min(1,(215-l)/85));
    p[k+3]=Math.round(a*255);
    if(a>0.2){if(xx<minX)minX=xx;if(xx>maxX)maxX=xx;if(y<minY)minY=y;if(y>maxY)maxY=y}
  }
  x.putImageData(d,0,0);
  if(maxX<0)return c.toDataURL('image/png');
  const m=6;minX=Math.max(0,minX-m);minY=Math.max(0,minY-m);maxX=Math.min(c.width-1,maxX+m);maxY=Math.min(c.height-1,maxY+m);
  const o=document.createElement('canvas');o.width=maxX-minX+1;o.height=maxY-minY+1;
  o.getContext('2d').drawImage(c,minX,minY,o.width,o.height,0,0,o.width,o.height);
  return o.toDataURL('image/png');
}

const TH_D=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],TH_P=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
function thRead6(str,hi){
  str=str.replace(/^0+/,'');let out='';const L=str.length;
  for(let i=0;i<L;i++){const d=+str[i],pos=L-i-1;if(!d)continue;
    if(pos===1&&d===1)out+='สิบ';else if(pos===1&&d===2)out+='ยี่สิบ';else if(pos===0&&d===1&&(L>1||hi))out+='เอ็ด';else out+=TH_D[d]+TH_P[pos];}
  return out;
}
function thReadInt(str){str=String(str).replace(/^0+/,'');if(!str)return '';if(str.length>6)return thReadInt(str.slice(0,-6))+'ล้าน'+thRead6(str.slice(-6),true);return thRead6(str)}
function bahtText(n){
  const [i,f]=r2(Math.abs(n)).toFixed(2).split('.');
  const bi=thReadInt(i),st=thRead6(f);
  if(!bi&&!st)return 'ศูนย์บาทถ้วน';
  return (bi?bi+'บาท':'')+(st?st+'สตางค์':'ถ้วน');
}

/* Build A4 pages; groups move to the next page whole when they fit, otherwise split by row. */
async function buildPages(q,no){
  await loadDocFonts();
  const box=document.getElementById('render-box');box.innerHTML='';
  const groups=q.groups.map(g=>({g,items:visibleItems(g)})).filter(x=>x.items.length||x.g.title||x.g.forLine);
  const m=mk('','pg measure');box.appendChild(m);
  const hdr=mk(dHeader(q,no));m.appendChild(hdr);
  const ch=mk(COLHEAD);m.appendChild(ch);
  const cont=mk(dCont(q,no,9,9));m.appendChild(cont);
  const gm=groups.map(x=>{const el=mk(dGroup(x.g,0,x.items.length,true));m.appendChild(el);
    const gh=[...el.querySelectorAll('.d-gh')].reduce((s,e)=>s+e.offsetHeight,0);
    const rows=[...el.querySelectorAll('.d-item')].map(e=>e.offsetHeight);
    return {gh,rows,total:el.offsetHeight};});
  const fa=mk(dFootA(q));m.appendChild(fa);const fb=mk(dFootB(q));m.appendChild(fb);
  const H={hdr:hdr.offsetHeight,ch:ch.offsetHeight,cont:cont.offsetHeight,fa:fa.offsetHeight,fb:fb.offsetHeight};
  box.innerHTML='';
  const pages=[];let cur={parts:[],used:H.hdr+H.ch};pages.push(cur);
  const newPage=()=>{cur={parts:[],used:H.cont+H.ch};pages.push(cur)};
  groups.forEach((x,gi)=>{
    const me=gm[gi];
    if(cur.used+me.total<=AVAIL){cur.parts.push([gi,0,x.items.length,true]);cur.used+=me.total;return}
    if(me.total<=AVAIL-H.cont-H.ch&&cur.parts.length){newPage();cur.parts.push([gi,0,x.items.length,true]);cur.used+=me.total;return}
    let i=0,head=true;
    while(i<x.items.length||head){
      const need=(head?me.gh:0)+(me.rows[i]||0);
      if(cur.used+need>AVAIL&&cur.parts.length)newPage();
      let used=head?me.gh:0,j=i;
      while(j<x.items.length&&cur.used+used+me.rows[j]<=AVAIL){used+=me.rows[j];j++}
      if(j===i&&i<x.items.length){used+=me.rows[j];j++}
      cur.parts.push([gi,i,j,head]);cur.used+=used;i=j;head=false;
      if(i<x.items.length)newPage();
    }
  });
  if(cur.used+H.fa+H.fb<=AVAIL){cur.fa=cur.fb=true}
  else if(cur.used+H.fa<=AVAIL){cur.fa=true;newPage();cur.fb=true}
  else{newPage();cur.fa=cur.fb=true}
  const n=pages.length;
  return pages.map((p,pi)=>{
    let h=pi===0?dHeader(q,no):dCont(q,no,pi+1,n);
    if(p.parts.length||pi===0)h+=COLHEAD;
    p.parts.forEach(([gi,a,b,head])=>{h+=dGroup(groups[gi].g,a,b,head)});
    if(p.fa)h+=dFootA(q);
    if(p.fb)h+=dFootB(q);
    h+=`<div class="d-strip"><span>${esc(S.company.nameTh)}&nbsp;&nbsp;|&nbsp;&nbsp;${esc(S.company.mobile)}&nbsp;&nbsp;|&nbsp;&nbsp;${esc(S.company.email)}</span><span>${esc(no)}&nbsp;&nbsp;หน้า ${pi+1}/${n}</span></div>`;
    return mk(h,'pg');
  });
}

/* ---------- PDF ---------- */
function validate(){
  const items=Q.groups.reduce((s,g)=>s+visibleItems(g).length,0);
  if(!items)return 'ยังไม่มีรายการสินค้า เพิ่มอย่างน้อย 1 รายการก่อนสร้าง PDF';

}
function safeName(s){return String(s||'').replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,'_').slice(0,60)}
function defaultName(){return 'Quotation-'+safeName(Q.customer.attn)+'-'+(Q.no||previewNo())}
function cleanFile(s){return String(s||'').replace(/[\r\n]+/g,' ').replace(/[\\/:*?"<>|]+/g,'').replace(/\.pdf\s*$/i,'').trim().slice(0,120)}
function openNameSheet(){
  const err=validate();if(err){toast(err,3500);return}
  openSheet('sh-name');
  const f=document.getElementById('fname');f.value=Q.fileName||defaultName();
  document.getElementById('fname-no').textContent=Q.no?('เลขที่เอกสาร '+Q.no):('เลขที่เอกสารที่จะได้ '+previewNo());
  setTimeout(()=>{f.focus();try{f.setSelectionRange(0,f.value.length)}catch(e){}},80);

document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='fname'&&e.key==='Enter'){e.preventDefault();makePdf()}});
async function issueQuote(){
  const fEl=document.getElementById('fname');
  const typed=cleanFile(fEl&&!document.getElementById('sh-name').hidden?fEl.value:(Q.fileName||''));
  const wasDefault=!typed||typed===defaultName();

  Q.updatedAt=Date.now();LS.set('draft',Q);

async function makePdf(){
  if(busy)return;
  const err=validate();if(err){toast(err,3200);return}
  if(!window.html2canvas||!window.jspdf){toast('โหลดตัวสร้าง PDF ไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วเปิดหน้านี้ใหม่',3800);return}
  busy=true;const btns=document.querySelectorAll('[data-act="pdf"],[data-act="pdf-go"]');const olds=[...btns].map(b=>b.innerHTML);
  btns.forEach(b=>{b.disabled=true;b.textContent='กำลังสร้าง…'});
  let box=document.getElementById('render-box');
  try{
    await issueQuote();
    const pages=await buildPages(Q,Q.no);
    pages.forEach(p=>box.appendChild(p));
    await Promise.all([...box.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):0));
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',compress:true});
    for(let i=0;i<pages.length;i++){
      const cv=await window.html2canvas(pages[i],{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true,windowWidth:1000});
      if(i)pdf.addPage();pdf.addImage(cv.toDataURL('image/jpeg',0.9),'JPEG',0,0,210,297,undefined,'FAST');
    }
    box.innerHTML='';
    const blob=pdf.output('blob');
    const filename=(Q.fileName||defaultName())+'.pdf';
    saveHistory();
    const nameOpen=!document.getElementById('sh-name').hidden;
    await deliver(blob,filename);
    if(nameOpen)closeSheets();
    renderEditor();
    if(!document.getElementById('sh-preview').hidden)renderPreview();
  }catch(e){console.error(e);box.innerHTML='';toast('สร้าง PDF ไม่สำเร็จ ลองอีกครั้ง',3200)}
  finally{busy=false;document.querySelectorAll('[data-act="pdf"],[data-act="pdf-go"]').forEach((b,i)=>{b.disabled=false;b.innerHTML=olds[i]!==undefined?olds[i]:b.innerHTML})}
}
async function saveHistory(){
  let ok;
  try{ok=await store.saveQuote(clone(Q))}catch(e){ok=false}
  if(ok!==false)return;
  const lite=clone(Q);lite.groups.forEach(g=>g.photo=null);

  else toast('พื้นที่ในเครื่องเต็ม บันทึกประวัติไม่ได้ ให้สำรองเป็น Excel แล้วลบใบเก่าออก',6000);

async function deliver(blob,filename,okMsg){
  okMsg=okMsg||('ได้ไฟล์ PDF แล้ว '+Q.no);
  if(downloads){
    try{await downloads.save({filename,data:blob});toast(okMsg);return}
    catch(e){
      const c=e&&e.code;
      if(c==='declined'){toast('ยกเลิกการบันทึกแล้ว');return}
      if(c==='rate_limited'){toast('มีหน้าต่างบันทึกเปิดอยู่ รอสักครู่แล้วลองใหม่');return}
    }
  }
  try{
    const file=new File([blob],filename,{type:blob.type||'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),30000);toast(okMsg);
}

  const tb={bottom:{style:'thin',color:{argb:LINE}}};
  const subR=r;
  ws.mergeCells(`C${r}:D${r}`);put('C'+r,'รวมเป็นเงิน',kF,{vertical:'middle',indent:1});
  const sc=put('E'+r,{formula:`SUM(E${first}:E${spacer})`,result:t.sub},vF,{horizontal:'right',vertical:'middle'});sc.numFmt='#,##0.00';
  ws.getCell('C'+r).border=tb;sc.border=tb;ws.getRow(r).height=20;r++;
  let vatR=null;
  if(q.vat){vatR=r;ws.mergeCells(`C${r}:D${r}`);put('C'+r,'ภาษีมูลค่าเพิ่ม 7%',kF,{vertical:'middle',indent:1});
    const vc=put('E'+r,{formula:`ROUND(E${subR}*0.07,2)`,result:t.vat},vF,{horizontal:'right',vertical:'middle'});vc.numFmt='#,##0.00';
    ws.getCell('C'+r).border=tb;vc.border=tb;ws.getRow(r).height=20;r++;}
  ws.getRow(r).height=6;r++;
  const gR=r;ws.mergeCells(`C${r}:D${r}`);
  put('C'+r,{richText:[{text:'ยอดสุทธิ',font:F({bold:true,size:10.5,color:{argb:'FFFFFFFF'}})},{text:'\nGrand total (THB)',font:F({size:8,color:{argb:'FFB9D3E3'}})}]},null,{vertical:'middle',wrapText:true,indent:1},fill(NAVY));
  const gc=put('E'+r,{formula:vatR?`E${subR}+E${vatR}`:`E${subR}`,result:t.grand},F({bold:true,size:13,color:{argb:'FFFFFFFF'}}),{horizontal:'right',vertical:'middle'},fill(NAVY));gc.numFmt='#,##0.00';
  ws.getRow(r).height=32;r++;

  /* amount in words + notes (left) */
  ws.mergeCells(`A${subR}:B${subR}`);put('A'+subR,'จำนวนเงินตัวอักษร',F({size:8.5,bold:true,color:{argb:MUTED}}),{vertical:'bottom',indent:1},LIGHT);
  const wEnd=vatR||subR+1;
  const wStart=subR+1;
  if(wEnd>=wStart){ws.mergeCells(`A${wStart}:B${Math.max(wEnd,wStart)}`)}
  put('A'+wStart,{formula:`IFERROR("("&_xlfn.BAHTTEXT(E${gR})&")","")`,result:'('+bahtText(t.grand)+')'},F({bold:true,size:10,color:{argb:NAVY}}),{vertical:'top',wrapText:true,indent:1},LIGHT);
  let nr=Math.max(wEnd,wStart)+2;
  if(q.notes&&q.notes.trim()){
    if(nr<=gR){/* notes sit beside the grand total */}
    ws.mergeCells(`A${nr}:B${nr}`);put('A'+nr,'หมายเหตุ / เงื่อนไข',F({size:8.5,bold:true,color:{argb:MUTED}}),{vertical:'bottom',indent:1});
    const nl=nr+1;ws.mergeCells(`A${nl}:B${nl}`);
    put('A'+nl,q.notes.trim(),F({size:9.5,color:{argb:BODY}}),{vertical:'top',wrapText:true,indent:1});
    ws.getRow(nl).height=Math.max(ws.getRow(nl).height||15,15*lines(q.notes.trim(),72)+4);
    r=Math.max(r,nl+1);
  }
  r++;

  /* signatures */
  const sTop=r;for(let i=0;i<4;i++)ws.getRow(sTop+i).height=18;
  const lineR=sTop+4;
  ws.mergeCells(`A${lineR}:B${lineR}`);ws.mergeCells(`C${lineR}:E${lineR}`);
  const ln={top:{style:'thin',color:{argb:'FF9AAAB6'}}};
  ['A','B'].forEach(c=>ws.getCell(c+lineR).border=ln);['C','D','E'].forEach(c=>ws.getCell(c+lineR).border=ln);
  const sig=[[`(..........................................)`,`(${S.signerName})`,F({bold:true,color:{argb:NAVY}})],
    ['ผู้อนุมัติสั่งซื้อ / Accepted by','ผู้เสนอราคา / Authorized by',F({bold:true,size:9,color:{argb:BODY}})],
    ['วันที่ ........../........../..........','วันที่ '+docDate(q.date),F({size:9,color:{argb:'FF5A6B78'}})]];
  put('A'+lineR,sig[0][0],sig[0][2],{horizontal:'center',vertical:'top'});put('C'+lineR,sig[0][1],sig[0][2],{horizontal:'center',vertical:'top'});
  ws.getRow(lineR).height=20;
  sig.slice(1).forEach((s,i)=>{const rr=lineR+1+i;ws.mergeCells(`A${rr}:B${rr}`);ws.mergeCells(`C${rr}:E${rr}`);
    put('A'+rr,s[0],s[2],{horizontal:'center'});put('C'+rr,s[1],s[2],{horizontal:'center'});ws.getRow(rr).height=15});
  r=lineR+3;

  /* images */
  const rightW=colPx(W[2])+colPx(W[3])+colPx(W[4]);
  const EMU=9525;
  const toCol=(px,startCol)=>{let c=startCol;while(c<W.length-1&&px>colPx(W[c])){px-=colPx(W[c]);c++}return {c,off:Math.max(0,px)}};
  const addPic=async(src,pos,row0,rowOffPx,wpx,hpx)=>{const ext=/^data:image\/png/.test(src)?'png':'jpeg';const id=wb.addImage({base64:src,extension:ext});
    ws.addImage(id,{tl:{nativeCol:pos.c,nativeColOff:Math.round(pos.off*EMU),nativeRow:row0,nativeRowOff:Math.round(rowOffPx*EMU)},ext:{width:wpx,height:hpx},editAs:'oneCell'})};
  const fit=async(src,maxW,maxH)=>{const s=await imgSize(src);const k=Math.min(maxW/s.w,maxH/s.h);return {w:Math.round(s.w*k),h:Math.round(s.h*k)}};
  if(S.showStamp&&stampImg()){const d=await fit(stampImg(),136,40);await addPic(stampImg(),toCol((rightW-d.w)/2,2),sTop-1,2,d.w,d.h)}
  if(S.showSign!==false&&signImg()){const d=await fit(signImg(),160,40);await addPic(signImg(),toCol((rightW-d.w)/2,2),sTop-1,54,d.w,d.h)}
  for(const p of pics){const d=await fit(p.src,50,Math.max(20,p.n*25-6));await addPic(p.src,{c:1,off:colPx(W[1])-d.w-8},p.row-1,3,d.w,d.h)}

  /* print setup + footer */
  ws.pageSetup.printArea=`A1:E${r}`;
  let hPt=0;for(let i=1;i<=r;i++)hPt+=ws.getRow(i).height||15;
  if(hPt<=980)ws.pageSetup.fitToHeight=1;
  ws.pageSetup.printTitlesRow=`${HR}:${HR}`;
  const amp=s=>String(s||'').replace(/&/g,'&&');
  ws.headerFooter={oddFooter:`&L&8${amp(co.nameTh)}  |  ${amp(co.mobile)}  |  ${amp(co.email)}&R&8 ${amp(q.no)}  หน้า &P/&N`};

  /* guide sheet */
  const wh=wb.addWorksheet('วิธีแก้ไข');wh.getColumn(1).width=100;
  [['วิธีแก้ไขไฟล์นี้',true],
   ['แก้ "ราคา/หน่วย" (คอลัมน์ C) หรือ "จำนวน" (คอลัมน์ D) ได้เลย ช่อง "จำนวนเงิน", "รวมเป็นเงิน", "ภาษีมูลค่าเพิ่ม 7%", "ยอดสุทธิ" และจำนวนเงินตัวอักษร จะคำนวณใหม่เอง',false],
   ['แก้ชื่อสินค้า ชื่อลูกค้า หรือหมายเหตุ พิมพ์ทับในช่องได้เลย',false],
   ['เพิ่มรายการ: คลิกขวาที่เลขแถวของรายการสุดท้าย เลือก "แทรก" แล้วคัดลอกสูตรช่อง "จำนวนเงิน" จากแถวข้างบนมาใส่ ยอดรวมจะนับรายการใหม่ให้เอง',false],
   ['ลบรายการ: คลิกขวาที่เลขแถว เลือก "ลบ" ทั้งแถว',false],
   ['หน้ากระดาษตั้งเป็น A4 แนวตั้งไว้แล้ว สั่งพิมพ์หรือบันทึกเป็น PDF จาก Excel ได้ทันที',false],
   ['หมายเหตุ: ไฟล์นี้แยกจากแอป แก้ใน Excel แล้วจะไม่อัปเดตกลับเข้าแอป',false]
  ].forEach((h,i)=>{const c=wh.getCell(i+1,1);c.value=h[0];c.font={name:'Tahoma',size:h[1]?13:10.5,bold:h[1]};c.alignment={wrapText:true,vertical:'middle'};wh.getRow(i+1).height=h[1]?24:32});
  const buf=await wb.xlsx.writeBuffer();
  return new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
async function makeExcel(){
  if(busy)return;
  const err=validate();if(err){toast(err,3500);return}
  busy=true;const btns=[...document.querySelectorAll('[data-act="xl-go"]')];const olds=btns.map(b=>b.innerHTML);
  btns.forEach(b=>{b.disabled=true;b.textContent='กำลังสร้าง…'});
  try{
    await issueQuote();
    const blob=await buildXlsx(Q);
    saveHistory();
    const nameOpen=!document.getElementById('sh-name').hidden;
    await deliver(blob,(Q.fileName||defaultName())+'.xlsx','ได้ไฟล์ Excel แล้ว '+Q.no);
    if(nameOpen)closeSheets();
    renderEditor();
  }catch(e){console.error(e);toast('สร้างไฟล์ Excel ไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่',3800)}
  finally{busy=false;btns.forEach((b,i)=>{b.disabled=false;b.innerHTML=olds[i]})}
}
async function exportHistoryExcel(q,btn){
  if(busy)return;busy=true;const old=btn.innerHTML;btn.disabled=true;btn.textContent='กำลังสร้าง…';
  try{const blob=await buildXlsx(q);await deliver(blob,(q.fileName||nameFor(q))+'.xlsx','ได้ไฟล์ Excel แล้ว '+q.no)}
  catch(e){console.error(e);toast('สร้างไฟล์ Excel ไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่',3800)}
  finally{busy=false;if(btn.isConnected){btn.disabled=false;btn.innerHTML=old}}
}

/* ---------- boot ---------- */
function boot(){
  const cs=LS.get('settings-cache');if(cs)S=mergeSettings(cs);
  const ic=LS.get('img-cache');if(ic){SIGN=ic.sign||null;STAMP=ic.stamp||null}
  const d=LS.get('draft');Q=d&&d.groups?d:newQuote();
  renderEditor();
  connect();
}
async function connect(){
  const cl=window.claude;if(!cl||typeof cl.use!=='function')return;
  try{[db,downloads]=await Promise.all([cl.use('db').catch(()=>null),cl.use('downloads').catch(()=>null)])}catch(e){}
  if(!db)return;
  try{
    const s=await store.get('settings/main');if(s){S=mergeSettings(s);LS.set('settings-cache',S)}
    const [sg,st]=await Promise.all([store.get('settings/sign'),store.get('settings/stamp')]);
    SIGN=sg&&sg.img||null;STAMP=st&&st.img||null;LS.set('img-cache',{sign:SIGN,stamp:STAMP});
    renderBar();
    const no=document.querySelector('#editor input[readonly]');if(no&&!Q.no)no.value=previewNo();
  }catch(e){console.warn(e)}
}
boot();
})();
</script>
